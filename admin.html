<body class="dark">
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><img src="assets/images/logo.png?v=2" alt="" class="nav-logo-mark" width="32" height="32" /><span class="nav-logo-word">Queen<span>City</span>Connect</span></a>

        <li><a href="index.html">Home</a></li>

      </ul>
      <div class="nav-right">
        <a href="hub.html" class="nav-cta">Find Resources</a>
      </div>
    </div>
  </nav>

  <section class="auth-page admin-page">
    <div class="container">
      <div class="auth-card admin-card">
        <span class="section-eyebrow">Private</span>
        <h1 class="section-title">Registered users</h1>
        <p class="section-sub">This list is stored on the server in the users database. Enter the admin password to view it.</p>

        <p class="auth-error" id="admin-error" hidden></p>

        <form id="admin-form" class="auth-form">
          <label for="admin-password">Admin password</label>
          <input type="password" id="admin-password" name="password" autocomplete="current-password" required />
          <button type="submit" class="btn-primary auth-submit">Show users</button>
        </form>

        <div id="admin-results" hidden>
          <p class="admin-total" id="admin-total"></p>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Sign-up method</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="admin-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    (function () {
      const form = document.getElementById('admin-form');
      const errorEl = document.getElementById('admin-error');
      const results = document.getElementById('admin-results');
      const totalEl = document.getElementById('admin-total');
      const rowsEl = document.getElementById('admin-rows');

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value || '—';
        return date.toLocaleString();
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        results.hidden = true;
        try {
          const response = await fetch('/api/admin/users', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('admin-password').value })
          });
          const type = response.headers.get('content-type') || '';
          const data = type.includes('application/json') ? await response.json().catch(() => ({})) : {};
          if (!response.ok) {
            throw new Error(data.error || 'Could not load users.');
          }
          totalEl.textContent = (data.total || 0) + ' registered user' + (data.total === 1 ? '' : 's');
          rowsEl.innerHTML = (data.users || []).map((user) => {
            return '<tr><td>' + escapeHtml(user.name) + '</td><td>' + escapeHtml(user.email) +
              '</td><td>' + escapeHtml(user.method) + '</td><td>' + escapeHtml(formatDate(user.created_at)) +
              '</td></tr>';
          }).join('') || '<tr><td colspan="4">No accounts in the database yet.</td></tr>';
          results.hidden = false;
        } catch (err) {
          errorEl.textContent = err.message || 'Could not load users.';
          errorEl.hidden = false;
        }
      });
    })();
  </script>
</body>

</html>
