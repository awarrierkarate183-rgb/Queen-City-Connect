<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>QueenCityConnect</title>
  <link rel="icon" href="favicon.ico?v=2" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #faf9f7;
      color: #1a1a1a;
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }
    .wake {
      width: min(420px, 100%);
      text-align: center;
    }
    .wake-mark {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin: 0 auto 22px;
      display: block;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin: 0 0 12px;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 32px;
      letter-spacing: -0.02em;
      font-weight: 400;
    }
    h1 span { color: #1a5c38; font-weight: 700; }
    p {
      margin: 0 auto;
      max-width: 34ch;
      font-size: 16px;
      line-height: 1.55;
      color: #3d3d3d;
    }
    .wake-spin {
      width: 28px;
      height: 28px;
      margin: 28px auto 0;
      border: 2.5px solid #e8e4df;
      border-top-color: #1a5c38;
      border-radius: 50%;
      animation: qcc-spin 0.8s linear infinite;
    }
    @keyframes qcc-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wake" id="qcc-wake">
    <img class="wake-mark" src="assets/images/logo.png?v=2" width="72" height="72" alt="" />
    <h1>Queen<span>City</span>Connect</h1>
    <p role="status" aria-live="polite">Getting the directory ready. This only takes a moment.</p>
    <div class="wake-spin" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      function safeNext() {
        try {
          var raw = new URLSearchParams(window.location.search).get('next') || '/';
          if (raw.charAt(0) !== '/') raw = '/' + raw;
          if (raw.indexOf('//') === 0 || /[\\:]/.test(raw)) return '/';
          return raw;
        } catch (e) {
          return '/';
        }
      }

      var dest = safeNext();
      var tries = 0;

      async function ready() {
        try {
          var res = await fetch('/api/health', { cache: 'no-store', credentials: 'omit' });
          if (res.ok) return true;
        } catch (e) {}
        return false;
      }

      async function tick() {
        tries += 1;
        if (await ready() || tries > 60) {
          window.location.replace(dest);
          return;
        }
        setTimeout(tick, 1500);
      }

      tick();
    })();
  </script>
</body>
</html>
