<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>QueenCityConnect</title>
  <link rel="icon" href="favicon.ico?v=2" sizes="any" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #faf9f7;
      color: #1a1a1a;
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }
    .wake {
      width: min(400px, 100%);
      text-align: center;
    }
    .wake-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: block;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(26, 92, 56, 0.16);
    }
    h1 {
      margin: 0 0 10px;
      font-family: "DM Serif Display", Georgia, "Times New Roman", serif;
      font-size: 30px;
      letter-spacing: -0.02em;
      font-weight: 400;
    }
    h1 span { color: #1a5c38; font-weight: 700; }
    p {
      margin: 0 auto;
      max-width: 32ch;
      font-size: 16px;
      line-height: 1.55;
      color: #3d3d3d;
    }
    .wake-spin {
      width: 28px;
      height: 28px;
      margin: 28px auto 0;
      border: 2.5px solid #e8e4df;
      border-top-color: #1a5c38;
      border-radius: 50%;
      animation: qcc-spin 0.8s linear infinite;
    }
    @keyframes qcc-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wake" id="qcc-wake">
    <svg class="wake-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#1a5c38"/>
      <path fill="#f0ece6" d="M18 22 L24 10 L32 18 L40 10 L46 22 Z"/>
      <circle cx="32" cy="36" r="14.5" fill="none" stroke="#f0ece6" stroke-width="5.2"/>
      <g fill="#f0ece6">
        <rect x="22.2" y="34" width="3.2" height="8"/>
        <rect x="26" y="31.2" width="3.4" height="10.8"/>
        <path d="M31.1 24.8 L33 22.2 L34.9 24.8 L34.9 42 L31.1 42 Z"/>
        <rect x="35.6" y="32.4" width="3.2" height="9.6"/>
        <rect x="39.2" y="35" width="2.8" height="7"/>
      </g>
      <path d="M41 45.5 C44 48.5 47 49.2 50.2 47.6" fill="none" stroke="#e8d5a3" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="50.6" cy="47.2" r="2.4" fill="#e8d5a3"/>
      <circle cx="46.4" cy="52.4" r="1.7" fill="#b8d4c4"/>
      <circle cx="54.2" cy="51.6" r="1.5" fill="#f0ece6"/>
    </svg>
    <h1>Queen<span>City</span>Connect</h1>
    <p role="status" aria-live="polite">Getting the directory ready. This only takes a moment.</p>
    <div class="wake-spin" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      function safeNext() {
        try {
          var raw = new URLSearchParams(window.location.search).get('next') || '/';
          if (raw.charAt(0) !== '/') raw = '/' + raw;
          if (raw.indexOf('//') === 0 || /[\\:]/.test(raw)) return '/';
          return raw;
        } catch (e) {
          return '/';
        }
      }

      var dest = safeNext();
      var tries = 0;

      async function ready() {
        try {
          var res = await fetch('/api/health', { cache: 'no-store', credentials: 'omit' });
          if (res.ok) return true;
        } catch (e) {}
        return false;
      }

      async function tick() {
        tries += 1;
        if (await ready() || tries > 80) {
          window.location.replace(dest);
          return;
        }
        setTimeout(tick, 1200);
      }

      tick();
    })();
  </script>
</body>
</html>
